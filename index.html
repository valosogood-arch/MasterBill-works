<style>
/* [แก้ตรงนี้] สี: เปลี่ยน --accent ตัวเดียวเพื่อเปลี่ยนสีหลัก */
:root {
  color-scheme: dark;
  --accent: #4cc2e8; --accent-ink: #04202b;
  --bg: #0b1117; --surface: #111a23; --raised: #1a2733; --raised-2: #243546;
  --text: #e6edf3; --muted: #8b9aa9; --line: #1f2b37;
  --good: #4be3a0; --bad: #ff6b6b; --warn: #ffd479;
  --font: "Inter", "Noto Sans Thai", system-ui, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 68px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.7 var(--font); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
body.noscroll { overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }
section { padding: 64px 0; }
h1, h2, h3 { line-height: 1.3; margin: 0; font-weight: 600; }
h2 { font-size: 1.6rem; margin-bottom: 8px; }
.sub { color: var(--muted); margin: 0 0 32px; }
.gone { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- animations ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(22px); } }
@keyframes drop { from { opacity: 0; transform: translateY(-100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.95); } }
@keyframes pop2 { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@keyframes flow { to { stroke-dashoffset: -15; } }
@keyframes breathe { 50% { opacity: .55; } }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(-60px, 40px) scale(1.18); } }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@keyframes smoke { from { transform: translateY(0) scale(.6); opacity: .8; } to { transform: translateY(-34px) scale(1.6); opacity: 0; } }
@keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
@keyframes shiver { 0%, 100% { transform: translate(0); } 25% { transform: translate(-2px, 1px); } 75% { transform: translate(2px, -1px); } }

/* ---------- header ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); border-bottom: 1px solid var(--line); animation: drop .8s cubic-bezier(.2,.7,.2,1) backwards; transition: background .3s, box-shadow .3s; }
header.top.scrolled { background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(12px); box-shadow: 0 10px 30px -18px #000; }
header.top::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--accent); transform: scaleX(var(--p, 0)); transform-origin: left; }
.nav { display: flex; align-items: center; justify-content: space-between; min-height: 60px; gap: 12px; }
.brand { font-weight: 700; text-decoration: none; letter-spacing: .01em; }
.nav ul { display: flex; gap: 24px; list-style: none; margin: 0; padding: 0; }
.nav ul a { position: relative; text-decoration: none; color: var(--muted); font-size: .95rem; transition: color .25s; }
.nav ul a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .4s cubic-bezier(.2,.7,.2,1); }
.nav ul a:hover { color: var(--text); } .nav ul a:hover::after { transform: scaleX(1); }
@media (max-width: 640px) { .nav ul { display: none; } }
.nav-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--raised); border: 1px solid transparent; color: var(--text); font: inherit; font-size: .9rem; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: border-color .25s, transform .25s, background .25s; }
.icon-btn:hover { background: var(--raised-2); border-color: var(--accent); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.95); }
.prog { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--accent); }
.prog svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.prog circle { fill: none; stroke-width: 4; }
.pbg { stroke: var(--raised-2); } .pfg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 100; transition: stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1); }

/* ---------- buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 600; text-decoration: none; padding: 13px 28px; border-radius: 14px; cursor: pointer; transition: transform .3s, box-shadow .3s; user-select: none; touch-action: manipulation; }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-120%); transition: transform .7s; pointer-events: none; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -10px color-mix(in srgb, var(--accent) 75%, transparent); }
.btn:hover::after { transform: translateX(120%); }
.btn:active, .btn.held { transform: scale(.96); }
.btn.ghost { background: color-mix(in srgb, var(--accent) 16%, var(--raised)); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }

/* ---------- hero ---------- */
main { overflow-x: clip; }
.hero { position: relative; isolation: isolate; display: grid; gap: 28px; align-items: center; padding: 56px 0 24px; }
@media (min-width: 860px) { .hero { grid-template-columns: 1.05fr 1fr; padding-top: 80px; } }
.hero::before { content: ""; position: absolute; right: -80px; top: -40px; width: min(520px, 90vw); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 20%, transparent), transparent); z-index: -1; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
.hero h1 { font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 700; letter-spacing: -.01em; animation: rise .9s .1s cubic-bezier(.2,.7,.2,1) backwards; }
.hero p { color: var(--muted); font-size: 1.1rem; margin: 16px 0 28px; max-width: 30em; animation: rise .9s .3s cubic-bezier(.2,.7,.2,1) backwards; }
.hero .btn { animation: rise .9s .5s cubic-bezier(.2,.7,.2,1) backwards; }
.art { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 8px; animation: rise 1s .35s cubic-bezier(.2,.7,.2,1) backwards; }
.art svg { width: 100%; height: auto; display: block; }
.art small { display: block; text-align: center; color: var(--muted); font-size: .82rem; padding: 2px 0 6px; }

/* ---------- svg parts ---------- */
.wire { fill: none; stroke: #4d6376; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.part { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.flow { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1 14; animation: flow var(--spd, 1s) linear infinite; transition: opacity .3s; }
.lbl { fill: var(--muted); font: 11px var(--font); } .lbl.b { fill: var(--text); font-weight: 600; font-size: 12px; }
.box { fill: var(--raised); stroke: #4d6376; stroke-width: 2; }
.smoke circle { fill: #9aa7b2; opacity: 0; }
.burnt .smoke circle { animation: smoke 1.6s ease-out infinite; }
.burnt .smoke circle:nth-child(2) { animation-delay: .5s; } .burnt .smoke circle:nth-child(3) { animation-delay: 1s; }
.burnt #sym path { stroke: #7a5a4a; }
#heroSvg .flow, #heroSvg .hglow { opacity: 0; }
#heroSvg.on .flow { opacity: 1; } #heroSvg.on .hglow { opacity: .9; animation: breathe 2s ease-in-out infinite; }
#hLever { transform-origin: 250px 240px; transition: transform .4s cubic-bezier(.2,.9,.3,1.3); }
#heroSvg:not(.on) #hLever { transform: rotate(35deg); }
.swhit { cursor: pointer; fill: transparent; }

/* ---------- lab cards ---------- */
.labs { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .labs { grid-template-columns: 1fr 1fr; } }
@media (min-width: 960px) { .labs { grid-template-columns: repeat(3, 1fr); } }
.lcard { position: relative; display: flex; flex-direction: column; gap: 10px; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; transition: transform .4s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .4s; }
.lcard:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 16px 36px -18px color-mix(in srgb, var(--accent) 60%, transparent); }
.lcard:active { transform: scale(.985); }
.lic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, var(--raised)); }
.lic svg { width: 34px; height: 34px; } .ic { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.lcard h3 { font-size: 1.1rem; } .lcard p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.55; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.tag { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--raised); color: var(--muted); }
.lcard .okb { display: none; position: absolute; top: 16px; right: 16px; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--good); color: #032015; }
.lcard.done .okb { display: block; animation: pop2 .5s; }
.go { color: var(--accent); font-weight: 600; font-size: .92rem; transition: transform .3s; } .lcard:hover .go { transform: translateX(4px); }

.feats { display: grid; gap: 16px; }
@media (min-width: 760px) { .feats { grid-template-columns: repeat(3, 1fr); } }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
.feat h3 { font-size: 1.05rem; margin-bottom: 6px; } .feat p { margin: 0; color: var(--muted); }
footer { border-top: 1px solid var(--line); padding: 28px 0 36px; color: var(--muted); font-size: .9rem; }
.js .rv { opacity: 0; } .js .rv.in { opacity: 1; animation: rise .9s cubic-bezier(.2,.7,.2,1) var(--d, 0ms) backwards; }

/* ---------- lab view ---------- */
.view { position: fixed; inset: 0; z-index: 15; display: none; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.view.open { display: block; animation: fade .3s ease backwards; }
.view.open .vwrap { animation: rise .5s cubic-bezier(.2,.7,.2,1) backwards; }
.vh { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.vrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.vwrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
.vwrap h1 { font-size: 1.7rem; margin: 26px 0 6px; outline: 0; }
.why { color: var(--muted); margin: 0 0 4px; } .why b { color: var(--text); }
.stage { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 65%), linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 24px 24px, var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px; margin: 18px 0 14px; }
.stage svg { width: 100%; height: auto; display: block; }
.verdict { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; min-height: 66px; background: var(--raised); border: 1px solid transparent; transition: background .3s, border-color .3s; }
.vi { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--raised-2); } .vi::before { content: "i"; }
.verdict[data-k=ok] { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--raised)); } .verdict[data-k=ok] .vi { background: var(--good); color: #032015; } .verdict[data-k=ok] .vi::before { content: "✓"; }
.verdict[data-k=warn] { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--raised)); } .verdict[data-k=warn] .vi { background: var(--warn); color: #2a2003; } .verdict[data-k=warn] .vi::before { content: "!"; }
.verdict[data-k=bad] { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--raised)); } .verdict[data-k=bad] .vi { background: var(--bad); color: #2a0b0b; } .verdict[data-k=bad] .vi::before { content: "✕"; }
.verdict.pop { animation: pop2 .45s cubic-bezier(.2,.9,.3,1.4); } .verdict[data-k=bad].pop { animation: shake .5s; }
.controls { display: grid; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 14px; }
.ctl { display: grid; gap: 8px; } .row { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; } .row b { color: var(--accent); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--raised); border: 1px solid transparent; color: var(--text); padding: 9px 16px; border-radius: 999px; font: inherit; font-size: .92rem; cursor: pointer; transition: background .25s, color .25s, transform .2s; touch-action: manipulation; }
.chip:hover { background: var(--raised-2); } .chip:active { transform: scale(.94); }
.chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: .9rem; min-height: 1.4em; }
.readouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ro { background: var(--raised); border-radius: 14px; padding: 10px 12px; min-width: 0; } .ro small { display: block; color: var(--muted); font-size: .76rem; line-height: 1.3; }
.ro strong { display: block; font-size: 1.05rem; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chal { display: flex; gap: 12px; align-items: center; margin-top: 14px; padding: 14px 16px; border: 1px dashed var(--muted); border-radius: 16px; }
.cb { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; font-weight: 700; }
.chal.done { border-style: solid; border-color: var(--good); } .chal.done .cb { background: var(--good); border-color: var(--good); color: #032015; animation: pop2 .5s; }
.lnav { display: flex; justify-content: space-between; gap: 12px; margin: 22px 0 36px; }
.lnav a { text-decoration: none; }
.scope { margin-top: 10px; background: var(--bg); border-radius: 14px; }
.trace { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.bad .trace { stroke: var(--bad); }
.h { fill: var(--raised-2); cursor: pointer; transition: fill .25s; } .h:hover { fill: #35506a; }
.strip { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.5; opacity: 0; transition: opacity .3s; } .strip.on { opacity: 1; }
.strip.b { fill: color-mix(in srgb, var(--warn) 22%, transparent); stroke: var(--warn); }
.mk { fill: var(--accent); } .mk.b { fill: var(--warn); } .mkt { fill: #04202b; font: 700 11px var(--font); text-anchor: middle; }
.blade { fill: var(--accent); opacity: .85; } .wv { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.chip-box { transition: stroke .3s, fill .3s; } .chip-box.bad { stroke: var(--bad); animation: shiver .15s linear infinite; }
#mk { transition: transform .5s cubic-bezier(.2,.8,.3,1); }

/* ---------- settings + toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); }
.overlay.open { display: flex; animation: fade .25s ease backwards; }
.panel { position: relative; width: 100%; max-width: 360px; padding: 24px; border-radius: 20px; background: linear-gradient(180deg, #16222d, var(--surface)); border: 1px solid #24323f; box-shadow: 0 30px 80px -20px rgba(0,0,0,.75); animation: pop .45s cubic-bezier(.2,.8,.2,1) backwards; }
.panel h2 { font-size: 1.2rem; margin: 0 44px 18px 0; } .panel label { display: block; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
.x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--raised-2); color: var(--text); font-size: 1rem; cursor: pointer; transition: background .25s, color .25s, transform .35s; }
.x:hover { background: var(--accent); color: var(--accent-ink); transform: rotate(90deg); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--good); color: #032015; padding: 10px 22px; border-radius: 999px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .3s, transform .45s cubic-bezier(.2,.9,.3,1.3); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.cf { position: fixed; width: 8px; height: 12px; border-radius: 2px; z-index: 41; pointer-events: none; animation: fly .95s ease-out forwards; }
.how { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; margin: 16px 0 0; }
.how summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; color: var(--accent); }
.how summary::-webkit-details-marker { display: none; } .how summary::before { content: "▸"; transition: transform .25s; } .how[open] summary::before { transform: rotate(90deg); }
.how ol { margin: 12px 0 2px; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.how li { position: relative; padding-left: 38px; counter-increment: s; }
.how li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .85rem; display: grid; place-items: center; }
.code { margin: 10px 0 0; padding: 12px 14px; background: #0d151c; border: 1px solid var(--line); border-radius: 14px; font: 500 .85rem/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #cfe8f5; white-space: pre-wrap; overflow-x: auto; }

const fill = (k, o = {}) => t(k).replace(/\{(\w+)\}/g, (_, n) => o[n] ?? "");

const saveDone = () => { try { localStorage.setItem(PROG_KEY, JSON.stringify([...done])); } catch (e) {} };

const slider = (id, key, min, max, step, val) => `<label class="ctl"><span class="row"><span data-i18n="${key}"></span><b id="${id}V"></b></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`;
const chips = (id, key, items) => `<div class="ctl"><span class="row"><span data-i18n="${key}"></span></span><div class="chips" id="${id}">${items.map(([v, l, k]) => `<button class="chip" type="button" data-v="${v}" aria-pressed="false"${k ? ` data-i18n="${l}"` : ""}>${k ? "" : l}</button>`).join("")}</div></div>`;
const ro = (id, key) => `<div class="ro"><small data-i18n="${key}"></small><strong id="${id}"></strong></div>`;
const setChip = (root, id, val) => $$(`#${id} .chip`, root).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == val)));

function verdict(root, kind, key, vars) {
  const v = $(".verdict", root), sig = kind + key;
  $(".vt", v).textContent = fill(key, vars);
  if (v.dataset.sig !== sig) { v.dataset.sig = sig; v.dataset.k = kind; v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop"); }
}
function chal(root, id, cond) {
  if (cond && !done.has(id)) complete(id, $(".chal", root));
  $(".chal", root).classList.toggle("done", done.has(id));
}
function setCode(root, html) {
  const c = $("#codeBox", root); c.classList.toggle("gone", !html); c.innerHTML = html || "";
}
function complete(id, el) {
  done.add(id); saveDone(); renderProgress();
  const tt = $("#toast"); tt.textContent = "✓ " + t("chal_toast"); tt.classList.add("show"); setTimeout(() => tt.classList.remove("show"), 2200);
  const r = el.getBoundingClientRect(), cols = ["#4cc2e8", "#4be3a0", "#ffd479", "#ff6b6b", "#ffffff"];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
    c.className = "cf"; c.style.cssText = `left:${r.left + 28}px;top:${r.top + 20}px;background:${cols[i % 5]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--rot:${Math.random() * 540}deg`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 1000);
  }
}

/* ==========================================================
   ห้องทดลอง (LABS): แต่ละห้องคือฟังก์ชันใน MOUNT.<id>
   stage = ภาพ SVG, controls = ตัวควบคุม, update() = คำนวณและอัปเดตภาพ
   ========================================================== */
const MOUNT = {};

/* ----- 1) Breadboard (มีรางจ่ายไฟ + − และแบบทดสอบ 10 ข้อ) ----- */
MOUNT.board = () => {
  let root, q, order = [], idx = -1, right = 0, answered = false, finished = false, last = null, msg = { k: "idle", key: "board_hint" };
  const L = "ABCDEFGHIJ", X = c => 38 + c * 20, RY = [22, 38, 262, 278], TY = r => r < 5 ? 68 + r * 17 : 172 + (r - 5) * 17;
  const pos = h => h.t === "t" ? [X(h.c), TY(h.r)] : [X(h.c), RY[h.r]];
  const nm = h => h.t === "t" ? L[h.r] + (h.c + 1) : t("rn_" + h.r) + " #" + (h.c + 1);
  const T = (c, l) => ({ t: "t", c: c - 1, r: L.indexOf(l) }), Rl = (r, c) => ({ t: "r", r, c: c - 1 });
  /* [แก้ตรงนี้] คำถามทั้ง 10 ข้อ: T(คอลัมน์, แถว) = รูกลางบอร์ด, Rl(รางที่ 0-3, ช่อง) = รางจ่ายไฟ (0 = + บน, 1 = − บน, 2 = + ล่าง, 3 = − ล่าง) */
  const POOL = [[T(3, "A"), T(3, "E")], [T(3, "A"), T(3, "F")], [T(5, "B"), T(6, "B")], [Rl(0, 2), Rl(0, 13)], [Rl(0, 4), Rl(1, 4)],
    [Rl(0, 5), T(5, "D")], [Rl(0, 7), Rl(2, 7)], [T(10, "J"), T(10, "G")], [T(8, "E"), T(8, "F")], [Rl(3, 3), Rl(3, 12)]];
  const conn = (a, b) => a.t === "t" && b.t === "t" ? a.c === b.c && (a.r < 5) === (b.r < 5) : a.t === "r" && b.t === "r" && a.r === b.r;
  const why = (a, b) => conn(a, b) ? (a.t === "r" ? "r_rail" : "r_same") : a.t !== b.t ? "r_rt" : a.t === "t" ? (a.c === b.c ? "r_gap" : "r_col") : (a.r % 2 !== b.r % 2 ? "r_pm" : "r_tb");
  const hole = el => el.dataset.t === "r" ? { t: "r", r: +el.dataset.r, c: +el.dataset.c } : { t: "t", c: +el.dataset.c, r: +el.dataset.r };
  const stripSel = h => h.t === "r" ? `[data-s="r${h.r}"]` : `[data-s="${h.c}-${h.r < 5 ? 0 : 1}"]`;
  let svg = `<svg viewBox="0 0 340 300" role="img" aria-label="breadboard"><rect x="8" y="6" width="322" height="288" rx="12" class="box"/><rect x="18" y="146" width="302" height="12" rx="3" fill="#0b1117"/>`;
  RY.forEach((y, r) => {
    const col = r % 2 ? "#5aa9ff" : "#ff6b6b", ly = y + (r % 2 ? 10 : -10);
    svg += `<rect class="strip" data-s="r${r}" x="29" y="${y - 9}" width="298" height="18" rx="9"/><line x1="30" x2="326" y1="${ly}" y2="${ly}" stroke="${col}" stroke-width="1.5" opacity=".7"/><text class="lbl b" x="19" y="${y + 4}" text-anchor="middle" style="fill:${col}">${r % 2 ? "−" : "+"}</text>`;
    for (let c = 0; c < 15; c++) svg += `<circle class="h" r="5" cx="${X(c)}" cy="${y}" data-t="r" data-r="${r}" data-c="${c}"/>`;
  });
  for (let c = 0; c < 15; c++) for (const h of [0, 1]) svg += `<rect class="strip" data-s="${c}-${h}" x="${X(c) - 9}" y="${TY(h * 5) - 9}" width="18" height="${4 * 17 + 18}" rx="9"/>`;
  for (let c = 0; c < 15; c++) { svg += `<text class="lbl" x="${X(c)}" y="58" text-anchor="middle">${c + 1}</text>`; for (let r = 0; r < 10; r++) svg += `<circle class="h" r="5.5" cx="${X(c)}" cy="${TY(r)}" data-t="t" data-c="${c}" data-r="${r}"/>`; }
  for (let r = 0; r < 10; r++) svg += `<text class="lbl" x="19" y="${TY(r) + 4}" text-anchor="middle">${L[r]}</text>`;
  svg += `<g id="mA" class="gone"><circle class="mk" r="10"/><text class="mkt" y="4">A</text></g><g id="mB" class="gone"><circle class="mk b" r="10"/><text class="mkt" y="4">B</text></g></svg>`;
  const light = (h, cls) => { const e = $(stripSel(h), root); e.classList.add("on"); if (cls) e.classList.add(cls); };
  const clear = () => $$(".strip", root).forEach(e => e.classList.remove("on", "b"));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  return {
    stage: svg,
    controls: `<div class="chips"><button class="btn" id="next" type="button"></button><button class="chip" id="yes" type="button" data-i18n="board_yes"></button><button class="chip" id="no" type="button" data-i18n="board_no"></button></div><div class="readouts">${ro("roN", "ro_q")}${ro("roC", "ro_right")}</div>`,
    init(r) {
      root = r; q = s => $(s, r);
      $(".stage svg", r).addEventListener("click", e => {
        const el = e.target.closest(".h"); if (!el || (idx >= 0 && !answered && !finished)) return;
        const h = hole(el); clear(); light(h); msg = { k: "idle", key: h.t === "r" ? "board_sel_rail" : "board_sel" }; this.update();
      });
      q("#next").onclick = () => {
        if (idx >= 0 && !answered && !finished) return;
        if (finished || !order.length) { order = shuffle([...POOL.keys()]); idx = -1; right = 0; finished = false; }
        idx++; clear(); answered = false; last = POOL[order[idx]];
        [["#mA", last[0]], ["#mB", last[1]]].forEach(([id, h]) => { const g = q(id); g.classList.remove("gone"); g.setAttribute("transform", `translate(${pos(h)[0]} ${pos(h)[1]})`); });
        msg = { k: "idle", key: "board_q" }; this.update();
      };
      const ans = yes => {
        if (idx < 0 || answered || finished) return; answered = true;
        const [a, b] = last, ok = yes === conn(a, b); if (ok) right++;
        light(a); light(b, "b");
        if (idx === POOL.length - 1) { finished = true; msg = { k: right >= 8 ? "ok" : "warn", key: right >= 8 ? "fin_ok" : "fin_try", why: why(a, b) }; }
        else msg = { k: ok ? "ok" : "bad", key: ok ? "board_ok" : "board_bad", why: why(a, b) };
        this.update();
      };
      q("#yes").onclick = () => ans(true); q("#no").onclick = () => ans(false);
    },
    update() {
      q("#next").textContent = t(finished ? "board_again" : idx < 0 ? "board_start" : "board_next");
      q("#next").disabled = idx >= 0 && !answered && !finished;
      q("#yes").disabled = q("#no").disabled = idx < 0 || answered || finished;
      q("#roN").textContent = Math.max(0, idx + 1) + " / 10"; q("#roC").textContent = right;
      const vars = { n: right, r: msg.why ? t(msg.why) : "" }; if (last) { vars.a = nm(last[0]); vars.b = nm(last[1]); }
      verdict(root, msg.k, msg.key, vars);
      chal(root, "board", finished && right >= 8);
    }
  };
};

/* ----- 2) LED + resistor ----- */
MOUNT.led = () => {
  const VF = 2; let V = 5, R = 220, rev = false, burnt = false, root, q;
  return {
    stage: `<svg viewBox="0 0 360 220" role="img" aria-label="LED circuit">
      <defs><filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter></defs>
      <path class="wire" d="M50,94 V40 H118 M194,40 H300 V84 M300,112 V180 H50 V106"/>
      <path id="flow" class="flow" d="M50,94 V40 H300 V180 H50 V106"/>
      <path class="part" d="M36,94 H64 M44,106 H56"/>
      <path class="part" d="M118,40 l8,-12 l12,24 l12,-24 l12,24 l12,-24 l12,24 l8,-12"/>
      <circle id="glow" cx="300" cy="98" r="28" fill="#ff4d4d" opacity="0" filter="url(#bl)"/>
      <g id="sym"><path class="part" d="M288,84 H312 L300,110 Z M288,112 H312"/></g>
      <path id="rays" class="part" d="M320,86 l9,-9 M326,98 l9,-9" opacity="0"/>
      <g class="smoke"><circle cx="300" cy="76" r="6"/><circle cx="291" cy="78" r="5"/><circle cx="309" cy="78" r="5"/></g>
      <text class="lbl b" id="bat" x="70" y="104"></text><text class="lbl" x="20" y="98">+</text><text class="lbl" x="20" y="114">−</text>
      <text class="lbl b" id="rv" x="156" y="18" text-anchor="middle"></text></svg>`,
    controls: `${slider("V", "led_v", 3, 12, .5, 5)}${slider("R", "led_r", 0, 1000, 10, 220)}
      <div class="chips"><button class="chip" id="flip" type="button" aria-pressed="false" data-i18n="led_flip"></button><button class="chip" id="fix" type="button" data-i18n="led_fix"></button><button class="chip gone" id="renew" type="button" data-i18n="led_renew"></button></div>
      <p class="note" id="rec"></p><div class="readouts">${ro("roI", "ro_i")}${ro("roV", "ro_vr")}${ro("roP", "ro_p")}</div>`,
    init(r) {
      root = r; q = s => $(s, r);
      q("#V").oninput = e => { V = +e.target.value; this.update(); };
      q("#R").oninput = e => { R = +e.target.value; this.update(); };
      q("#flip").onclick = () => { rev = !rev; this.update(); };
      q("#renew").onclick = () => { burnt = false; this.update(); };
      q("#fix").onclick = () => { if (V > VF) { R = Math.min(1000, Math.round((V - VF) / 0.015 / 10) * 10); q("#R").value = R; } this.update(); };
    },
    update() {
      const I = rev ? 0 : R <= 0 ? Infinity : Math.max(0, V - VF) / R * 1000, fin = isFinite(I);
      if (!burnt && I > 35) burnt = true;
      const b = burnt ? 0 : Math.min(1.3, I / 20);
      q("svg").classList.toggle("burnt", burnt);
      q("#sym").setAttribute("transform", rev ? "rotate(180 300 98)" : "");
      const g = q("#glow"); g.style.opacity = Math.min(1, b * .9); g.setAttribute("r", 26 + b * 18);
      q("#rays").style.opacity = b > .05 ? Math.min(1, b) : 0;
      const fl = q("#flow"); fl.style.opacity = !burnt && I > .05 ? 1 : 0; fl.style.setProperty("--spd", Math.max(.3, 2.2 - Math.min(fin ? I : 30, 30) / 30 * 1.9) + "s");
      q("#bat").textContent = V + " V"; q("#rv").textContent = R + " Ω"; q("#VV").textContent = V + " V"; q("#RV").textContent = R + " Ω";
      q("#flip").setAttribute("aria-pressed", String(rev)); q("#renew").classList.toggle("gone", !burnt);
      q("#rec").textContent = V > VF ? fill("led_rec", { r: Math.round((V - VF) / 0.015 / 10) * 10 }) : "";
      q("#roI").textContent = burnt ? "—" : (fin ? I.toFixed(1) : "∞") + " mA";
      q("#roV").textContent = burnt || !fin ? "—" : (I / 1000 * R).toFixed(2) + " V";
      q("#roP").textContent = burnt || !fin ? "—" : ((I / 1000) ** 2 * R * 1000).toFixed(0) + " mW";
      const i = fin ? I.toFixed(1) : "∞";
      if (burnt) verdict(root, "bad", "led_burnt");
      else if (rev) verdict(root, "bad", "led_rev");
      else if (V <= VF) verdict(root, "warn", "led_low");
      else if (I < 1) verdict(root, "warn", "led_dim", { i });
      else if (I <= 20) verdict(root, "ok", "led_ok", { i });
      else verdict(root, "warn", "led_hot", { i });
      setCode(root, `<span class="c">// I = (Vs − Vf) ÷ R</span>\nI = (${V} − 2) ÷ ${R} Ω = <span class="v">${burnt ? "—" : i + " mA"}</span>`);
      chal(root, "led", !burnt && !rev && V >= 9 && I >= 5 && I <= 20);
    }
  };
};

/* ----- 3) Button + pull-up ----- */
MOUNT.pullup = () => {
  let root, q, pu = false, pressed = false, samples = [], sawH = false, sawL = false, timer;
  const N = 48;
  return {
    stage: `<svg viewBox="0 0 360 220" role="img" aria-label="pull-up circuit">
      <path class="wire" d="M90,26 H170 M130,110 H230 M130,110 V142 M130,172 V200"/>
      <text class="lbl b" x="92" y="20">5 V</text>
      <g id="pur"><path class="part" d="M130,26 V40 l-12,6 l24,12 l-24,12 l24,12 l-12,6 V110"/><text class="lbl" x="150" y="64">10 kΩ</text></g>
      <path id="flow" class="flow" d="M130,26 V200" style="opacity:0"/>
      <circle cx="130" cy="142" r="4" style="fill:var(--text)"/><circle cx="130" cy="172" r="4" style="fill:var(--text)"/>
      <path id="lever" class="part" d="M130,172 V146" style="transform-origin:130px 172px;transition:transform .15s"/>
      <path class="part" d="M116,200 H144 M122,207 H138 M127,214 H133"/>
      <circle cx="130" cy="110" r="5" style="fill:var(--accent)"/><text class="lbl b" id="nv" x="140" y="104"></text>
      <rect class="box" x="230" y="70" width="100" height="90" rx="10"/><text class="lbl b" x="280" y="124" text-anchor="middle">Arduino</text>
      <circle cx="230" cy="110" r="5" style="fill:var(--text)"/><text class="lbl" x="238" y="106">D2</text><text class="lbl" x="142" y="162">button</text><rect class="pbtn" id="hitBtn" x="96" y="128" width="68" height="56"/></svg>
      <svg class="scope" id="scope" viewBox="0 0 360 64"><text class="lbl" x="4" y="12">HIGH</text><text class="lbl" x="4" y="58">LOW</text><text class="lbl" x="356" y="12" text-anchor="end" data-i18n="scope_cap"></text><path id="trace" class="trace" d="M0,48"/></svg>`,
    controls: `<div class="chips"><button class="chip" id="pu" type="button" aria-pressed="false" data-i18n="pu_toggle"></button><button class="btn ghost" id="press" type="button" data-i18n="press"></button></div><div class="readouts">${ro("roR", "ro_pin")}</div>
      <table class="truth" id="truth"><thead><tr><th></th><th data-i18n="tr_np"></th><th data-i18n="tr_p"></th></tr></thead><tbody>
      <tr><th data-i18n="tr_off"></th><td class="bad" data-c="00" data-i18n="tr_rand"></td><td data-c="01">LOW</td></tr>
      <tr><th data-i18n="tr_on"></th><td data-c="10">HIGH</td><td data-c="11">LOW</td></tr></tbody></table>`,
    init(r) {
      root = r; q = s => $(s, r);
      q("#pu").onclick = () => { pu = !pu; this.update(); };
      const b = q("#press"), set = v => () => { pressed = v; b.classList.toggle("held", v); this.update(); };
      [b, q("#hitBtn")].forEach(el => {
        el.addEventListener("pointerdown", e => { e.preventDefault(); set(true)(); });
        ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, () => { if (pressed) set(false)(); }));
      });
      b.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!pressed) set(true)(); } });
      b.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") set(false)(); });
      const read = () => pu ? (pressed ? 0 : 1) : pressed ? 0 : (Math.random() < .5 ? 1 : 0);
      timer = setInterval(() => { samples.push(read()); if (samples.length > N) samples.shift(); this.update(); }, 90);
    },
    update() {
      const cur = samples.length ? samples[samples.length - 1] : (pu ? 1 : 0);
      q("#pu").setAttribute("aria-pressed", String(pu));
      q("#pur").style.opacity = pu ? 1 : .3;
      q("#lever").style.transform = pressed ? "rotate(0deg)" : "rotate(28deg)";
      const fl = q("#flow"); fl.style.opacity = pu && pressed ? 1 : 0; fl.style.setProperty("--spd", ".8s");
      q("#nv").textContent = pu || pressed ? (pressed ? "0 V" : "5 V") : "?";
      q("#roR").textContent = cur ? "HIGH (1)" : "LOW (0)";
      const st = x => "H" + x;
      let d = "M0," + (samples[0] ? 12 : 48);
      samples.forEach((v, i) => { if (i) d += " H" + (i * 360 / (N - 1)).toFixed(1) + " V" + (v ? 12 : 48); });
      q("#trace").setAttribute("d", d);
      q("#scope").classList.toggle("bad", !pu && !pressed);
      if (pu) { if (!pressed) sawH = true; else sawL = true; }
      if (!pu && !pressed) verdict(root, "bad", "pu_float");
      else if (!pu) verdict(root, "warn", "pu_half");
      else if (!pressed) verdict(root, "ok", "pu_hi");
      else verdict(root, "ok", "pu_lo");
      $$("#truth td", root).forEach(td => td.classList.toggle("on", td.dataset.c === (pu ? "1" : "0") + (pressed ? "1" : "0")));
      setCode(root, `<span class="c">// ${t(pu ? "cd_pull" : "cd_float")}</span>\npinMode(2, <span class="v">${pu ? "INPUT_PULLUP" : "INPUT"}</span>);\nint v = digitalRead(2);  <span class="c">// v =</span> <span class="v">${cur}</span>`);
      chal(root, "pullup", pu && sawH && sawL);
    },
    cleanup() { clearInterval(timer); }
  };
};

/* ----- 4) Voltage divider ----- */
MOUNT.divider = () => {
  let root, q, Vin = 5, R1 = 1, R2 = 20;
  return {
    stage: `<svg viewBox="0 0 360 240" role="img" aria-label="voltage divider">
      <path class="wire" d="M100,30 V44 M100,84 V122 M100,162 V192 M100,110 H220"/>
      <path id="flow" class="flow" d="M100,30 V192"/>
      <path class="part" d="M100,44 l-12,5 l24,10 l-24,10 l24,10 l-12,5"/><path class="part" d="M100,122 l-12,5 l24,10 l-24,10 l24,10 l-12,5"/>
      <path class="part" d="M86,194 H114 M92,201 H108 M97,208 H103"/>
      <circle cx="100" cy="110" r="5" style="fill:var(--accent)"/>
      <text class="lbl b" id="vin" x="108" y="26"></text><text class="lbl" id="r1" x="124" y="68"></text><text class="lbl" id="r2" x="124" y="150"></text>
      <text class="lbl b" id="vo" x="108" y="102"></text>
      <rect id="chip" class="box chip-box" x="220" y="74" width="74" height="72" rx="10"/><text class="lbl" x="257" y="102" text-anchor="middle">ESP32</text><text class="lbl b" id="rdg" x="257" y="124" text-anchor="middle"></text>
      <rect x="312" y="30" width="22" height="50.4" fill="#ff6b6b" opacity=".35"/><rect x="312" y="80.4" width="22" height="39.6" fill="#4be3a0" opacity=".35"/><rect x="312" y="120" width="22" height="90" fill="#ffd479" opacity=".25"/>
      <text class="lbl" x="323" y="224" text-anchor="middle">0 V</text><text class="lbl" x="323" y="22" text-anchor="middle">5 V</text>
      <g id="mk"><path class="part" d="M306,0 H340" style="stroke:#fff"/></g></svg>`,
    controls: `${chips("vinC", "dv_vin", [[5, "5 V (HC-SR04)"], [3.3, "3.3 V"]])}${slider("R1", "dv_r1", .5, 20, .5, 1)}${slider("R2", "dv_r2", .5, 20, .5, 20)}
      <div class="chips"><button class="chip" id="rec" type="button" data-i18n="dv_rec"></button></div><div class="readouts">${ro("roO", "ro_vout")}${ro("roC", "ro_idiv")}${ro("roQ", "ro_ratio")}</div>`,
    init(r) {
      root = r; q = s => $(s, r);
      $$("#vinC .chip", r).forEach(b => b.onclick = () => { Vin = +b.dataset.v; this.update(); });
      q("#R1").oninput = e => { R1 = +e.target.value; this.update(); };
      q("#R2").oninput = e => { R2 = +e.target.value; this.update(); };
      q("#rec").onclick = () => { R1 = 1; R2 = 2; q("#R1").value = 1; q("#R2").value = 2; this.update(); };
    },
    update() {
      const Vo = Vin * R2 / (R1 + R2), I = Vin / (R1 + R2);
      setChip(root, "vinC", Vin);

/* ----- 7) ลองเขียนโค้ด Arduino ----- */
MOUNT.code = () => {
  let root, q, prog = ["on13", "w500", "off13", "w500"], raf, t0 = 0, comp = null, lastHi = "";
  const MAXB = 16;
  /* [แก้ตรงนี้] บล็อกคำสั่ง: [โค้ดที่แสดง, เวลาที่ใช้ (ms)] */
  const BL = { on13: ["digitalWrite(13, HIGH);", 0], off13: ["digitalWrite(13, LOW);", 0], p25: ["analogWrite(9, 64);", 0], p50: ["analogWrite(9, 128);", 0], p100: ["analogWrite(9, 255);", 0], p0: ["analogWrite(9, 0);", 0], w200: ["delay(200);", 200], w500: ["delay(500);", 500], w1000: ["delay(1000);", 1000] };
  const LV = { p25: .25, p50: .5, p100: 1, p0: 0 };
  const PRE = { blink: ["on13", "w500", "off13", "w500"], fade: ["p25", "w500", "p50", "w500", "p100", "w500", "p0", "w500"], heart: ["on13", "w200", "off13", "w200", "on13", "w200", "off13", "w1000"] };
  const zig = (x, y) => `M${x},${y} l8,-12 l12,24 l12,-24 l12,24 l12,-24 l12,24 l8,-12`;
  function compile() {
    if (!prog.length) return { period: 0, segs: [], a13: 0, a9: 0, hasDelay: false, hasOn: false, constant: true };
    const run = st => { const segs = []; let t = 0; const s = { l: st.l, p: st.p }; prog.forEach((id, i) => { if (id === "on13") s.l = 1; else if (id === "off13") s.l = 0; else if (id in LV) s.p = LV[id]; const d = BL[id][1] || .01; segs.push({ i, t0: t, d, l: s.l, p: s.p }); t += d; }); return { segs, t, s }; };
    const r1 = run({ l: 0, p: 0 }), r2 = run(r1.s), P = r2.t;
    return { period: P, segs: r2.segs, a13: r2.segs.reduce((n, g) => n + g.d * g.l, 0) / P, a9: r2.segs.reduce((n, g) => n + g.d * g.p, 0) / P,
      hasDelay: prog.some(id => BL[id][1] > 0), hasOn: prog.includes("on13"), constant: r2.segs.every(g => g.l === r2.segs[0].l && g.p === r2.segs[0].p) };
  }
  return {
    stage: `<svg viewBox="0 0 360 300" role="img" aria-label="Arduino outputs">
      <defs><filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter></defs>
      <rect class="box" x="14" y="20" width="100" height="160" rx="10"/><text class="lbl b" x="64" y="104" text-anchor="middle">Arduino</text>
      <circle cx="114" cy="50" r="4" style="fill:var(--text)"/><text class="lbl" x="104" y="46" text-anchor="end">D13</text><circle cx="114" cy="140" r="4" style="fill:var(--text)"/><text class="lbl" x="104" y="136" text-anchor="end">D9 ~</text>
      <path class="wire" d="M114,50 H150 M226,50 H250 V64 M250,94 V110 M114,140 H150 M226,140 H250 V154 M250,184 V200"/>
      <path class="part" d="${zig(150, 50)}"/><path class="part" d="${zig(150, 140)}"/>
      <circle id="g13" cx="250" cy="79" r="22" fill="#ff4d4d" filter="url(#bl)" opacity="0"/><circle id="g9" cx="250" cy="169" r="22" fill="#4cc2e8" filter="url(#bl)" opacity="0"/>
      <path class="part" d="M238,66 H262 L250,90 Z M238,92 H262"/><path class="part" d="M238,156 H262 L250,180 Z M238,182 H262"/>
      <path class="part" d="M236,110 H264 M242,117 H258 M247,124 H253"/><path class="part" d="M236,200 H264 M242,207 H258 M247,214 H253"/>
      <text class="lbl" x="14" y="228">LED 13</text><path id="t13" class="trace" d="M20,248 H340"/>
      <text class="lbl" x="14" y="264">LED 9</text><path id="t9" class="trace" d="M20,286 H340" style="stroke:var(--accent)"/><line id="ph" y1="224" y2="290" x1="20" x2="20" style="stroke:var(--text);stroke-width:1.5;opacity:.7"/></svg>`,
    controls: `<div class="code prog" id="prog"></div>
      ${chips("addC", "cd_add", [["on13", "cd_b_on", 1], ["off13", "cd_b_off", 1], ["p25", "cd_b_p25", 1], ["p50", "cd_b_p50", 1], ["p100", "cd_b_p100", 1], ["p0", "cd_b_p0", 1], ["w200", "cd_w200", 1], ["w500", "cd_w500", 1], ["w1000", "cd_w1000", 1]])}
      ${chips("preC", "cd_pre", [["blink", "cd_pre_blink", 1], ["fade", "cd_pre_fade", 1], ["heart", "cd_pre_heart", 1]])}
      <div class="chips"><button class="chip" id="clrP" type="button" data-i18n="cd_clear"></button></div>
      <div class="readouts">${ro("roP", "ro_period")}${ro("roD13", "ro_d13")}${ro("roD9", "ro_d9")}</div>`,
    init(r) {
      root = r; q = s => $(s, r);
      const changed = () => { t0 = performance.now(); this.update(); };
      $$("#addC .chip", r).forEach(b => b.onclick = () => { if (prog.length < MAXB) { prog.push(b.dataset.v); changed(); } });
      $$("#preC .chip", r).forEach(b => b.onclick = () => { prog = [...PRE[b.dataset.v]]; changed(); });
      q("#clrP").onclick = () => { prog = []; changed(); };
      q("#prog").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { prog.splice(+b.dataset.rm, 1); changed(); } });
      t0 = performance.now();
      const loop = now => {
        const c = comp; let l = 0, p = 0, hi = [];
        if (c && c.segs.length) {
          if (c.period < 20) { l = c.a13; p = c.a9; q("#ph").style.opacity = 0; }
          else {
            const tn = (now - t0) % c.period, sg = c.segs.find(g => tn >= g.t0 && tn < g.t0 + g.d) || c.segs[c.segs.length - 1];
            l = sg.l; p = sg.p; c.segs.forEach(g => { if (tn >= g.t0 && tn < g.t0 + Math.max(g.d, 200)) hi.push(g.i); });
            const x = 20 + 320 * tn / c.period, ph = q("#ph"); ph.setAttribute("x1", x); ph.setAttribute("x2", x); ph.style.opacity = .7;
          }
        } else q("#ph").style.opacity = 0;
        q("#g13").style.opacity = l * .9; q("#g9").style.opacity = p * .9;
        const key = hi.join(","); if (key !== lastHi) { lastHi = key; $$("#prog .step", r).forEach(e => e.classList.toggle("on", hi.includes(+e.dataset.i))); }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    },
    update() {
      const c = comp = compile(); lastHi = "";
      q("#prog").innerHTML = `<div class="ln">void setup() {</div><div class="ln">  pinMode(13, OUTPUT);  pinMode(9, OUTPUT);</div><div class="ln">}</div><div class="ln">void loop() {</div>` +
        prog.map((id, i) => `<div class="ln step" data-i="${i}"><span>  ${BL[id][0]}</span><button class="rmx" type="button" data-rm="${i}" aria-label="remove">✕</button></div>`).join("") + `<div class="ln">}</div>`;
      $$("#addC .chip", root).forEach(b => b.disabled = prog.length >= MAXB);
      const X = tt => (20 + 320 * tt / c.period).toFixed(1);
      const path = (get, Y) => { if (!c.segs.length) return `M20,${Y(0)} H340`; if (c.period < 20) return `M20,${Y(get === g13 ? c.a13 : c.a9)} H340`; let d = `M20,${Y(get(c.segs[0]))}`; c.segs.forEach((g, i) => { if (i) d += ` H${X(g.t0)} V${Y(get(g))}`; }); return d + " H340"; };
      const g13 = g => g.l, g9 = g => g.p;
      q("#t13").setAttribute("d", path(g13, v => 248 - v * 18)); q("#t9").setAttribute("d", path(g9, v => 286 - v * 18));
      q("#roP").textContent = c.period >= 20 ? (c.period / 1000).toFixed(2) + " s" : c.period ? "< 1 ms" : "—"; q("#roD13").textContent = Math.round(c.a13 * 100) + "%"; q("#roD9").textContent = Math.round(c.a9 * 100) + "%";
      if (!prog.length) verdict(root, "idle", "cd_empty");
      else if (!c.hasDelay) verdict(root, "warn", "cd_nodelay", { d: Math.round(c.a13 * 100) });
      else if (c.constant) verdict(root, "warn", "cd_const");
      else if (c.hasOn && c.a13 < .01) verdict(root, "warn", "cd_flash");
      else verdict(root, "ok", "cd_ok", { p: (c.period / 1000).toFixed(1), d: Math.round(c.a13 * 100) });
      setCode(root, "");
      chal(root, "code", c.hasDelay && Math.abs(c.period - 2000) < 60 && Math.abs(c.a13 - .5) < .02);
    },
    cleanup() { cancelAnimationFrame(raf); }
  };
};

    controls: `${slider("D", "so_d", 0, 400, 1, 150)}${chips("sC", "so_surf", [["hard", "s_hard", 1], ["soft", "s_soft", 1], ["angle", "s_angle", 1]])}<div class="readouts">${ro("roD", "ro_dist")}${ro("roE", "ro_echo")}${ro("roR", "ro_read")}</div>`,

      const loop = now => {

      q("#oa").setAttribute("transform", surf === "angle" ? "rotate(40 11 105)" : "");

      q("#DV").textContent = d + " cm"; q("#roD").textContent = d + " cm";
      q("#roE").textContent = good ? tt + " µs" : "timeout"; q("#roR").textContent = good ? Math.round(tt / 58.3) + " cm" : "—";
      if (d < 2) verdict(root, "warn", "so_near");
      else if (surf === "soft") verdict(root, "bad", "so_soft");
      else if (surf === "angle") verdict(root, "bad", "so_angle");
      else verdict(root, "ok", "so_ok", { t: tt, d: Math.round(tt / 58.3) });
      setCode(root, good ? `<span class="c">// distance (cm) = echo (µs) ÷ 58</span>\n${tt} ÷ 58 = <span class="v">${Math.round(tt / 58.3)} cm</span>` : `pulseIn(echoPin, HIGH);  <span class="c">// →</span> <span class="v">0</span> <span class="c">(timeout)</span>`);
      chal(root, "sonar", surf === "hard" && Math.abs(d - 100) <= 5);
    },
    cleanup() { cancelAnimationFrame(raf); }
  };
};

MOUNT.strip = () => {
  let root, q, N = 30, B = 80, col = "white", cap = 2, raf, hue = 0, last = 0, st = { lit: 8, eff: .8, over: false };
  const PER = { white: 60, red: 20, rainbow: 40 }, CAPS = [1, 2, 5, 10], SL = 36;
  let sl = ""; for (let i = 0; i < SL; i++) sl += `<rect class="sl" x="${100 + (i % 18) * 13}" y="${i < 18 ? 96 : 128}" width="11" height="11" rx="2"/>`;
  return {
    stage: `<svg viewBox="0 0 360 230" role="img" aria-label="LED strip">
      <defs><filter id="bl" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="9"/></filter></defs>
      <rect id="sg" x="96" y="90" width="240" height="56" rx="10" fill="#fff" filter="url(#bl)" opacity="0"/>
      <path class="wire" d="M78,102 H96 M78,134 H96"/>
      <rect class="box" x="14" y="70" width="64" height="100" rx="10"/><text class="lbl b" x="46" y="90" text-anchor="middle">5 V</text><text class="lbl" id="psu" x="46" y="106" text-anchor="middle"></text>
      <rect x="24" y="124" width="44" height="12" rx="4" fill="#0b1117"/><rect id="gf" x="24" y="124" width="0" height="12" rx="4"/><text class="lbl" id="gt" x="46" y="156" text-anchor="middle"></text>
      ${sl}<text class="lbl b" id="warn" x="220" y="190" text-anchor="middle" style="fill:var(--bad)"></text></svg>`,
    controls: `${slider("N", "st_n", 1, 144, 1, 30)}${slider("B", "st_b", 0, 100, 5, 80)}${chips("colC", "st_color", [["white", "st_w", 1], ["red", "st_r", 1], ["rainbow", "st_rb", 1]])}${chips("capC", "st_ps", [[1, "1 A"], [2, "2 A"], [5, "5 A"], [10, "10 A"]])}
      <div class="readouts">${ro("roL", "ro_load")}${ro("roW", "ro_w")}${ro("roC", "ro_cap")}</div>`,
    init(r) {
      root = r; q = s => $(s, r); const rects = $$(".sl", r);
      q("#N").oninput = e => { N = +e.target.value; this.update(); }; q("#B").oninput = e => { B = +e.target.value; this.update(); };
      $$("#colC .chip", r).forEach(b => b.onclick = () => { col = b.dataset.v; this.update(); });
      $$("#capC .chip", r).forEach(b => b.onclick = () => { cap = +b.dataset.v; this.update(); });
      last = performance.now();
      const loop = now => {
        const dt = Math.min(.05, (now - last) / 1000); last = now; hue = (hue + dt * 60) % 360;
        const flick = st.over ? .5 + .5 * Math.random() : 1;
        rects.forEach((e, i) => {
          if (i < st.lit) { e.style.fill = col === "white" ? "#ffffff" : col === "red" ? "#ff3b3b" : `hsl(${(hue + i * 10) % 360} 90% 60%)`; e.style.opacity = Math.max(.15, st.eff) * flick; }
          else { e.style.fill = ""; e.style.opacity = ""; }
        });
        const g = q("#sg"); g.style.fill = col === "white" ? "#fff" : col === "red" ? "#ff3b3b" : `hsl(${hue} 90% 60%)`; g.style.opacity = st.lit ? st.eff * .5 * flick : 0;
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    },
    update() {
      const I = N * PER[col] * (B / 100) / 1000, over = I > cap, near = !over && I > cap * .8;
      st.lit = Math.ceil(N / 144 * SL); st.over = over && B > 0; st.eff = (B / 100) * (over ? cap / I : 1);
      setChip(root, "colC", col); setChip(root, "capC", cap);
      q("#NV").textContent = N + " LED"; q("#BV").textContent = B + "%"; q("#psu").textContent = cap + " A";
      const gf = q("#gf"); gf.setAttribute("width", (Math.min(1, I / cap) * 44).toFixed(1)); gf.style.fill = over ? "var(--bad)" : near ? "var(--warn)" : "var(--good)";
      q("#gt").textContent = Math.round(I / cap * 100) + "%"; q("#warn").textContent = over && B > 0 ? "⚠ brownout" : "";
      q("#roL").textContent = I.toFixed(2) + " A"; q("#roW").textContent = (5 * I).toFixed(1) + " W"; q("#roC").textContent = cap + " A";
      const vars = { i: I.toFixed(2), c: cap };
      if (B === 0) verdict(root, "idle", "st_off"); else if (over) verdict(root, "bad", "st_bad", vars); else if (near) verdict(root, "warn", "st_near", vars); else verdict(root, "ok", "st_ok", vars);
      setCode(root, `<span class="c">// I ≈ LED × mA × brightness</span>\n${N} × ${PER[col]} mA × ${B}% = <span class="v">${I.toFixed(2)} A</span>`);
      chal(root, "strip", N >= 60 && col === "white" && B >= 90 && !over && !near && CAPS.find(c => I <= c * .8) === cap);
    },
    cleanup() { cancelAnimationFrame(raf); }
  };
};

MOUNT.build = () => {
  let root, q, V = 9, tool = "R330", slots = [null, null, null, null], burnt = false;
  const POS = [[115, 44, 0], [245, 44, 0], [316, 120, 90], [180, 196, 180]];
  const TOOLS = [["R100", "100 Ω"], ["R330", "330 Ω"], ["R1k", "1 kΩ"], ["LED", "LED"], ["SW", "bd_sw", 1], ["W", "bd_wire", 1], ["flip", "bd_flip", 1], ["erase", "bd_erase", 1]];
  const mk = k => ({ R100: { type: "R", v: 100 }, R330: { type: "R", v: 330 }, R1k: { type: "R", v: 1000 }, LED: { type: "LED", rev: false }, SW: { type: "SW", on: true }, W: { type: "W" } })[k];
  function sim() {
    if (slots.every(x => !x)) return { k: "empty0" };
    if (slots.some(x => !x)) return { k: "open" };
    if (slots.some(x => x.type === "SW" && !x.on)) return { k: "sw" };
    if (slots.some(x => x.type === "LED" && x.rev)) return { k: "rev" };
    const R = slots.reduce((n, x) => n + (x.type === "R" ? x.v : 0), 0), nL = slots.filter(x => x.type === "LED").length, Vf = 2 * nL;
    if (!nL && !R) return { k: "short", R, Vf };
    if (!nL) return { k: "res", I: V / R * 1000, R, Vf };
    if (!R) return { k: "burn", I: Infinity, R, Vf };
    if (V <= Vf) return { k: "lowv", I: 0, R, Vf };
    const I = (V - Vf) / R * 1000;
    return { k: I > 35 ? "burn" : I < 1 ? "dim" : I <= 20 ? "ok" : "hot", I, R, Vf };
  }
  const comp = (c, r, b) => {
    if (!c) return `<text class="lbl" text-anchor="middle" y="6" transform="rotate(${-r})" style="font-size:20px">+</text>`;
    if (c.type === "W") return `<path class="part" d="M-30,0 H30"/>`;
    if (c.type === "R") return `<path class="part" d="M-30,0 H-20 M20,0 H30 M-20,0 l4,-9 l8,18 l8,-18 l8,18 l8,-18 l4,9"/><text class="lbl b" transform="rotate(${-r})" text-anchor="middle" y="-14">${c.v >= 1000 ? c.v / 1000 + "k" : c.v} Ω</text>`;
    if (c.type === "SW") return `<path class="part" d="M-30,0 H-14 M14,0 H30 M-14,0 L${c.on ? "14,-1" : "11,-14"}"/><circle cx="-14" r="3" style="fill:var(--text)"/><circle cx="14" r="3" style="fill:var(--text)"/>`;
    const g = burnt ? 0 : b;
    return `<circle r="22" fill="#ff4d4d" filter="url(#bl)" style="opacity:${Math.min(1, g * .9).toFixed(2)}"/><g${c.rev ? ' transform="rotate(180)"' : ""}><path class="part" d="M-30,0 H-8 M10,0 H30 M-8,-10 V10 L10,0 Z M10,-10 V10"${burnt ? ' style="stroke:#7a5a4a"' : ""}/></g>${burnt ? `<text class="lbl b" transform="rotate(${-r})" text-anchor="middle" y="-16" style="fill:var(--bad)">✕</text>` : ""}`;
  };
  return {
    stage: `<svg viewBox="0 0 360 240" role="img" aria-label="circuit builder"><defs><filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter></defs>
      <path class="wire" d="M44,104 V44 H316 V196 H44 V116"/><path id="flow" class="flow" d="M44,104 V44 H316 V196 H44 V116"/>
      <path class="part" d="M30,104 H58 M36,116 H52"/><text class="lbl" x="14" y="108">+</text><text class="lbl" x="14" y="124">−</text><text class="lbl b" id="bv" x="64" y="124"></text><g id="slots"></g></svg>`,
    controls: `${chips("toolC", "bd_parts", TOOLS)}${chips("vC", "bd_v", [[3, "3 V"], [5, "5 V"], [9, "9 V"]])}
      <div class="chips"><button class="chip" id="clr" type="button" data-i18n="bd_clear"></button><button class="chip" id="demo" type="button" data-i18n="bd_demo"></button></div>`,
    init(r) {
      root = r; q = s => $(s, r);
      $$("#toolC .chip", r).forEach(b => b.onclick = () => { tool = b.dataset.v; this.update(); });
      $$("#vC .chip", r).forEach(b => b.onclick = () => { V = +b.dataset.v; burnt = false; this.update(); });
      q("#clr").onclick = () => { slots = [null, null, null, null]; burnt = false; this.update(); };
      q("#demo").onclick = () => { const R = [100, 330, 1000].find(x => { const I = (V - 2) / x * 1000; return I >= 5 && I <= 20; }) || 1000; slots = [{ type: "R", v: R }, { type: "LED", rev: false }, { type: "W" }, { type: "W" }]; burnt = false; this.update(); };
      $(".stage svg", r).addEventListener("click", e => {
        const g = e.target.closest(".slot"); if (!g) return; const i = +g.dataset.i, c = slots[i];
        if (tool === "erase") slots[i] = null;
        else if (tool === "flip") { if (c && c.type === "LED") c.rev = !c.rev; else if (c && c.type === "SW") c.on = !c.on; }
        else slots[i] = mk(tool);
        burnt = false; this.update();
      });
    },
    update() {
      const res = sim(); if (res.k === "burn") burnt = true;
      const b = ["ok", "hot", "dim"].includes(res.k) ? Math.min(1.3, res.I / 20) : 0;
      q("#slots").innerHTML = slots.map((c, i) => { const [x, y, r] = POS[i]; return `<g class="slot" data-i="${i}" transform="translate(${x} ${y})"><rect class="sbg${c ? "" : " empty"}" x="-30" y="-24" width="60" height="48" rx="10"/><g transform="rotate(${r})">${comp(c, r, b)}</g><rect class="hit" x="-30" y="-24" width="60" height="48"/></g>`; }).join("");
      const fl = q("#flow"); fl.style.opacity = ["short", "res", "dim", "ok", "hot"].includes(res.k) ? 1 : 0;
      fl.style.setProperty("--spd", res.k === "short" ? ".3s" : Math.max(.3, 2.2 - Math.min(res.I || 0, 30) / 30 * 1.9) + "s");
      q("#bv").textContent = V + " V"; setChip(root, "toolC", tool); setChip(root, "vC", V);
      const i = res.I === Infinity ? "∞" : res.I != null ? res.I.toFixed(1) : "";
      ({ empty0: () => verdict(root, "idle", "bd_start"), open: () => verdict(root, "warn", "bd_open"), sw: () => verdict(root, "warn", "bd_sw_open"), rev: () => verdict(root, "bad", "bd_rev"),
        short: () => verdict(root, "bad", "bd_short"), burn: () => verdict(root, "bad", "bd_burn"), lowv: () => verdict(root, "warn", "bd_lowv"), res: () => verdict(root, "idle", "bd_res", { i }),
        dim: () => verdict(root, "warn", "bd_dim", { i }), ok: () => verdict(root, "ok", "bd_ok", { i }), hot: () => verdict(root, "warn", "bd_hot", { i }) })[res.k]();
      setCode(root, res.R != null && res.k !== "short" ? `<span class="c">// I = (V − ΣVf) ÷ ΣR</span>\nI = (${V} − ${res.Vf}) ÷ ${res.R} Ω = <span class="v">${i} mA</span>` : "");
      chal(root, "build", res.k === "ok" && V === 9);
    }
  };
};

    }
  };
};

sw.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleHero(); } });

// ปรากฏเมื่อเลื่อนถึง + แถบความคืบหน้าการเลื่อน
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 }) : null;
$$(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
const hdr = $("#hdr"); let tick = false;
addEventListener("scroll", () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    document.documentElement.style.setProperty("--p", max > 0 ? scrollY / max : 0);
    hdr.classList.toggle("scrolled", scrollY > 8); tick = false;
  });
}, { passive: true });

applyLang(lang);
renderProgress();
route();
</script>
